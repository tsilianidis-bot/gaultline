name: FAULTLINE verify

on:
  workflow_dispatch:
  push:
    branches:
      - grok/faultline-baseline-stabilization-2026-09-11
      - grok/faultline-completion-2026-09-08
      - release/verified-2026-10-22
  pull_request:
    branches:
      - grok/faultline-completion-2026-09-08
      - grok/faultline-baseline-stabilization-2026-09-11
      - release/verified-2026-10-22

concurrency:
  group: faultline-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck-build-test-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pre-deploy allowlist check
        run: |
          prod=1cb5dee13832c0556ec5a380ecc4ffb02513e875
          other=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          FAULTLINE_APPROVED_DEPLOY_SHAS="$prod" FAULTLINE_DEPLOY_SHA="$prod" BUILD_COMMIT="$other" bash scripts/guard-approved-deploy.sh
          if FAULTLINE_APPROVED_DEPLOY_SHAS="$prod" FAULTLINE_DEPLOY_SHA="$other" BUILD_COMMIT="$prod" bash scripts/guard-approved-deploy.sh; then
            echo "unapproved target was accepted" >&2
            exit 1
          fi
          if FAULTLINE_DEPLOY_SHA="$prod" BUILD_COMMIT="$prod" bash scripts/guard-approved-deploy.sh; then
            echo "missing external allowlist was accepted" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install disposable MariaDB binaries
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mariadb-server
          sudo systemctl stop mariadb.service || true
          sudo systemctl disable mariadb.service || true
          echo "/usr/sbin" >> "$GITHUB_PATH"
          test -x /usr/bin/mariadb-install-db
          test -x /usr/sbin/mariadbd

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Startup smoke without Stripe
        run: bash scripts/ci-startup-smoke.sh

      - name: Write build identity
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_BRANCH: ${{ github.ref_name }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: bash scripts/ci-write-build-identity.sh

      - name: Upload build identity
        uses: actions/upload-artifact@v4
        with:
          name: faultline-build-identity
          path: dist/build-identity.json
          if-no-files-found: error

  manus-deploy:
    name: Manus deploy (manual / disabled)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: verify
    environment: manus-deploy-disabled
    steps:
      - name: Refuse automatic Manus deploy
        run: |
          echo "Manus deploy is disabled on this baseline. This job is workflow_dispatch-only and does not publish."
          exit 1
