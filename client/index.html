        <h1>FAULTLINE — Macroeconomic Risk Intelligence Platform</h1>
        <p>FAULTLINE is an institutional-grade macroeconomic risk intelligence platform. The Pressure Index synthesizes 25 years of FRED data to identify systemic market stress before it moves prices. For educational purposes only — not investment advice.</p>

        <h2>What is FAULTLINE?</h2>
        <p>FAULTLINE tracks systemic market stress across equity, bond, credit, and crypto markets. The FAULTLINE Pressure Index™ synthesizes credit spreads, yield curve data, liquidity conditions, labor market signals, and volatility regimes from Federal Reserve (FRED) and U.S. Treasury data into a single 0–100 risk score. The engine was back-tested against 25 years of data and flagged elevated pressure before every major market crisis since 2000.</p>

        <h2>Why FAULTLINE Exists</h2>
        <p>Most platforms ask &ldquo;What should I buy?&rdquo; FAULTLINE begins with &ldquo;What is the market actually doing?&rdquo; Retail investors are repeatedly blindsided by market dislocations that institutional desks had been tracking for months — not because the signals weren't there, but because the tools to read them weren't accessible. FAULTLINE was built to close that gap.</p>

        <h2>The Pressure Index: Historical Validation</h2>
        <ul>
          <li><strong>2000–2002 Dot-com Bust:</strong> Pressure Index flagged HIGH RISK. S&amp;P 500 fell ~49% over 30 months.</li>
          <li><strong>October 2008 Lehman Collapse:</strong> Pressure Index reached 82 (CRITICAL). S&amp;P 500 fell ~57% peak-to-trough.</li>
          <li><strong>March 2020 COVID Crash:</strong> Pressure Index flagged HIGH RISK. S&amp;P 500 fell ~34% in 33 days.</li>
          <li><strong>2022 Fed Rate Shock Bear Market:</strong> Pressure Index flagged HIGH RISK. S&amp;P 500 fell ~25%, Nasdaq ~35%.</li>
          <li><strong>2024–2025 AI Concentration Risk:</strong> Pressure Index flagged ELEVATED. Narrow market leadership and tightening credit conditions.</li>
        </ul>

        <h2>Data Sources</h2>
        <p>FAULTLINE sources data exclusively from publicly available, institutional-grade providers: Federal Reserve / FRED (credit spreads, M2, lending standards), U.S. Treasury (yield curve), Bureau of Labor Statistics (unemployment, jobless claims), Bureau of Economic Analysis (GDP, PCE inflation), Polygon.io (equity prices), and CoinGecko (crypto data).</p>

        <h2>Key Features</h2>
        <ul>
          <li><strong>Pressure Index™</strong> — Real-time systemic risk score (0–100)</li>
          <li><strong>Seismograph Command Center</strong> — Deep macro intelligence dashboard</li>
          <li><strong>Stock Signals</strong> — Macro-regime classified momentum and risk signals</li>
          <li><strong>Crypto Intelligence</strong> — Bitcoin, Ethereum, and altcoin macro analysis</li>
          <li><strong>Historical Analog Engine</strong> — Crash pattern recognition and similarity scoring</li>
          <li><strong>Daily Intelligence Brief</strong> — AI-generated macro briefing every morning</li>
        </ul>

        <h2>Important Disclaimer</h2>
        <p><strong>FAULTLINE is for educational and informational purposes only.</strong> Nothing on this platform constitutes investment advice, a recommendation to buy or sell any security, or a solicitation of any investment. All investing involves risk, including the possible loss of principal. Past performance does not guarantee future results.</p>
