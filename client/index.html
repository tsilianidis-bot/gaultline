        <h1>See the fault before the break.</h1>
        <p>FAULTLINE is a systemic-risk intelligence and interpretation engine. It monitors relationships among credit, liquidity, rates, volatility, macroeconomic conditions, equities, and crypto to identify where systemic pressure is building. It does not predict a specific crash. Not investment advice.</p>

        <h2>The Faultline Pressure Index</h2>
        <p>The Pressure Index is a 0–100 weighted composite of high-yield credit and SOFR, high-yield credit with the 10-year and unemployment, the 10-year minus 2-year curve with the 10-year level, CPI and PPI with federal funds, unemployment with the 10-year, and a fixed 32.4% concentration baseline. 0–24 is Low Risk, 25–44 is Moderate, 45–64 is Elevated Risk, 65–79 is High Stress, and 80–100 is Systemic Crisis. High pressure is not a countdown to a crash.</p>

        <h2>Data sources</h2>
        <p>Primary statistics come from FRED. Equity aggregates come from Polygon. Quote boards use Yahoo. Crypto statistics come from CoinGecko. FAULTLINE does not call BLS, BEA, or Treasury.gov directly. Monthly series are lagged. Equity inputs used for regimes are daily aggregates, not a tick tape.</p>

        <h2>PLATO</h2>
        <p>PLATO is the interpretation layer. FAULTLINE produces the measurements. PLATO explains what they mean and does not replace them.</p>

        <h2>Historical analogs</h2>
        <p>The analog library compares the current vector profile with fixed fingerprints for periods including 1973, 1998, 2000, 2008, 2011, 2015, 2019, 2020, 2022, and 2023. Similarity is not a forecast.</p>

        <h2>Important Disclaimer</h2>
        <p><strong>FAULTLINE is for educational and informational purposes only.</strong> Nothing on this platform constitutes investment advice, a recommendation to buy or sell any security, or a solicitation of any investment. All investing involves risk, including the possible loss of principal. Past performance does not guarantee future results.</p>
